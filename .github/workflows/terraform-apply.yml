name: Terraform - Apply

on:
  workflow_call:
    inputs:
      environment-directory:
        description: 'Terraform environment directory to apply (e.g., terraform/environment/dev)'
        required: true
        type: string
      aws-role-to-assume:
        description: 'AWS IAM Role to assume'
        required: false
        type: string
        default: ''
      aws-region:
        description: 'AWS region'
        required: false
        type: string
        default: 'us-east-1'
    outputs:
      public_ip:
        description: 'The public IP of the provisioned EC2 instance'
        value: ${{ jobs.apply.outputs.public_ip }}
      security_group_id:
        description: 'The ID of the provisioned security group'
        value: ${{ jobs.apply.outputs.security_group_id }}
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
      VAULT_ROLE:
        required: false
      VAULT_URL:
        required: false
      aws_access_key_id:
        required: false
      aws_secret_access_key:
        required: false

jobs:
  apply:
    name: Apply Infrastructure Changes
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.get-output.outputs.public_ip }}
      security_group_id: ${{ steps.get-output.outputs.security_group_id }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: ./.github/actions/aws-auth
        with:
          aws-role-to-assume: ${{ inputs.aws-role-to-assume || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID || secrets['aws_access_key_id'] }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY || secrets['aws_secret_access_key'] }}
      - name: Initialize Terraform
        uses: ./.github/actions/terraform-init
        with:
          environment-directory: ${{ inputs.environment-directory }}
      - name: Terraform Apply
        shell: bash
        working-directory: ${{ inputs.environment-directory }}
        run: |
          terraform apply -auto-approve
      - name: Get Output IP
        id: get-output
        shell: bash
        working-directory: ${{ inputs.environment-directory }}
        run: |
          TF_IP=$(terraform output -raw public_ip 2>/dev/null || echo "")
          INSTANCE_ID=$(terraform output -raw instance_id 2>/dev/null || echo "")

          # Try to get Elastic IP associated with the instance (more reliable than terraform output)
          if [ -n "$INSTANCE_ID" ]; then
            EIP=$(aws ec2 describe-addresses --region us-east-1 \
              --filters "Name=instance-id,Values=$INSTANCE_ID" \
              --query "Addresses[0].PublicIp" --output text 2>/dev/null || echo "")
            if [ -n "$EIP" ] && [ "$EIP" != "None" ]; then
              echo "Using Elastic IP: $EIP"
              echo "public_ip=$EIP" >> $GITHUB_OUTPUT
            else
              echo "Using Terraform output IP: $TF_IP"
              echo "public_ip=$TF_IP" >> $GITHUB_OUTPUT
            fi
          else
            echo "public_ip=$TF_IP" >> $GITHUB_OUTPUT
          fi
          echo "security_group_id=$(terraform output -raw security_group_id)" >> $GITHUB_OUTPUT
