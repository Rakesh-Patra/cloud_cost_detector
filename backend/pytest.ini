[pytest]
testpaths = backend/tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:google\.genai.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:slowapi.*
    ignore::DeprecationWarning:pythonjsonlogger.*
    ignore::UserWarning:langsmith.*
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning
    ignore:.*_UnionGenericAlias.*:DeprecationWarning