apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloud-cost-gateway
  namespace: cloud-cost
  labels:
    app.kubernetes.io/name: cloud-cost-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
