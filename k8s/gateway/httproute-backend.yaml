apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloud-cost-backend-route
  namespace: cloud-cost
spec:
  parentRefs:
    - name: cloud-cost-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ws
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: PathPrefix
            value: /readyz
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: cloud-cost-backend-service
          port: 8000
