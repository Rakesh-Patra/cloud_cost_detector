apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud-cost-postgres-pvc
  namespace: cloud-cost
  labels:
    app.kubernetes.io/name: cloud-cost-detective
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: "helm"
    environment: "production"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
